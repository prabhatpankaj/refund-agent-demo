    <text x="78" y="316" font-size="56">Distributed System —</text>
    <text x="78" y="380" font-size="56">Treat It Like One</text>
  </g>

  <!-- dek -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-style="italic" font-size="23" fill="#5c6058">
    <text x="80" y="436">A refund agent, a network timeout, and every</text>
    <text x="80" y="466">distributed-systems lesson the LLM made obsolete.</text>
  </g>

  <!-- footer meta -->
  <text x="80" y="548" font-size="16" letter-spacing="1" fill="#8b8d84">9 MIN READ   ·   TYPESCRIPT &amp; SQL</text>
