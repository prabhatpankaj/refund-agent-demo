  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#fbfaf6"/>

  <!-- eyebrow -->
  <line x1="80" y1="164" x2="118" y2="164" stroke="#1f6f63" stroke-width="2"/>
  <text x="132" y="170" font-size="17" letter-spacing="5" font-weight="700" fill="#1f6f63">FIELD NOTES</text>

  <!-- headline -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-weight="500" fill="#1e211d">
